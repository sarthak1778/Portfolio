<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#E5A93C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162044"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Base background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#E5A93C" stroke-width="2.5" />
  
  <!-- Subtle Circuit Accent -->
  <path d="M 6 22 L 18 22 L 24 16" fill="none" stroke="#E5A93C" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="24" cy="16" r="2" fill="#5EEAD4" />
  
  <path d="M 58 42 L 46 42 L 40 48" fill="none" stroke="#E5A93C" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="40" cy="48" r="2" fill="#5EEAD4" />

  <!-- Monogram SC -->
  <text x="32" y="41" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="-1"
        fill="url(#scGrad)" 
        text-anchor="middle"
        filter="url(#glow)">SC</text>
</svg>
